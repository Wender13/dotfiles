# Generated by style/gnome/bin/export-gnome-settings.sh. Applied with: dconf load /
# @HOME@ is replaced by the home directory of the user applying it.

[org/gnome/shell]
disabled-extensions=['background-logo@fedorahosted.org']
enabled-extensions=['user-theme@gnome-shell-extensions.gcampax.github.com', 'clipboard-history@alexsaveau.dev', 'vertical-app-grid@lublst.github.io', 'blur-my-shell@aunetx', 'just-perfection-desktop@just-perfection', 'burn-my-windows@schneegans.github.com', 'compiz-alike-magic-lamp-effect@hermes83.github.com', 'lockkeys@vaina.lt', 'caffeine@patapon.info']
favorite-apps=['org.gnome.Nautilus.desktop', 'org.mozilla.firefox.desktop', 'google-chrome.desktop', 'com.microsoft.VSCode.desktop', 'com.getpostman.Postman.desktop', 'io.dbeaver.DBeaverCommunity.desktop', 'org.gnome.Ptyxis.desktop']
remember-mount-password=true

[org/gnome/shell/extensions/blur-my-shell]
settings-version=2

[org/gnome/shell/extensions/blur-my-shell/appfolder]
brightness=0.59999999999999998
sigma=30

[org/gnome/shell/extensions/blur-my-shell/dash-to-dock]
blur=true
brightness=0.59999999999999998
sigma=30
static-blur=true
style-dash-to-dock=0

[org/gnome/shell/extensions/blur-my-shell/panel]
brightness=0.59999999999999998
corner-radius=0
sigma=30

[org/gnome/shell/extensions/blur-my-shell/window-list]
brightness=0.59999999999999998
sigma=30

[org/gnome/shell/extensions/burn-my-windows]
active-profile='@HOME@/.config/burn-my-windows/profiles/1790850165847956.conf'

[org/gnome/shell/extensions/just-perfection]
accessibility-menu=false
dash-app-running=true
events-button=false
keyboard-layout=false
panel=false
panel-in-overview=true
quick-settings-dark-mode=true
search=false
show-apps-button=false
weather=false

[org/gnome/shell/extensions/user-theme]
name='Orchis-Dark'

[org/gnome/shell/extensions/vertical-app-grid]
app-sorting='alphabetical'
columns=5
icon-size=84
