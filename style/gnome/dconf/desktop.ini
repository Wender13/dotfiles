# Generated by style/gnome/bin/export-gnome-settings.sh. Applied with: dconf load /
# @HOME@ is replaced by the home directory of the user applying it.

[org/gnome/desktop/a11y/keyboard]
mousekeys-accel-time=0
mousekeys-enable=false
mousekeys-init-delay=0
mousekeys-max-speed=1000

[org/gnome/desktop/a11y/magnifier]
cross-hairs-length=58

[org/gnome/desktop/break-reminders/eyesight]
play-sound=true

[org/gnome/desktop/break-reminders/movement]
duration-seconds=uint32 300
interval-seconds=uint32 1800
play-sound=true

[org/gnome/desktop/input-sources]
sources=[('xkb', 'br')]

[org/gnome/desktop/interface]
color-scheme='prefer-dark'
cursor-theme='Vimix-cursors'
enable-animations=true
gtk-theme='Orchis-Dark'
icon-theme='Tela-circle-dark'
show-battery-percentage=true
toolkit-accessibility=false

[org/gnome/desktop/peripherals/touchpad]
send-events='enabled'
speed=0.026086956521739202
two-finger-scrolling-enabled=true

[org/gnome/desktop/screen-time-limits]
daily-limit-seconds=uint32 28800

[org/gnome/desktop/session]
idle-delay=uint32 300

[org/gnome/settings-daemon/plugins/color]
night-light-schedule-automatic=false

[org/gnome/settings-daemon/plugins/power]
sleep-inactive-ac-timeout=1800
sleep-inactive-ac-type='suspend'
