# Generated by style/gnome/bin/export-gnome-settings.sh. Applied with: dconf load /
# @HOME@ is replaced by the home directory of the user applying it.

[org/gnome/desktop/wm/keybindings]
activate-window-menu=['<Super>space']
begin-move=['<Super>Return']
begin-resize=['<Alt>Return']
close=['<Super>w']
cycle-group=@as []
cycle-group-backward=@as []
cycle-panels=@as []
cycle-panels-backward=@as []
cycle-windows=@as []
cycle-windows-backward=@as []
maximize=@as []
minimize=['<Super>d']
move-to-monitor-down=@as []
move-to-monitor-left=@as []
move-to-monitor-right=@as []
move-to-monitor-up=@as []
move-to-workspace-1=@as []
move-to-workspace-last=@as []
move-to-workspace-left=@as []
move-to-workspace-right=@as []
panel-run-dialog=['<Super>r']
show-desktop=['<Shift><Super>d']
switch-applications=['<Super>Tab']
switch-applications-backward=['<Shift><Super>Tab']
switch-group=@as []
switch-group-backward=@as []
switch-input-source=@as []
switch-input-source-backward=@as []
switch-panels=@as []
switch-panels-backward=@as []
switch-to-workspace-1=@as []
switch-to-workspace-last=@as []
switch-to-workspace-left=@as []
switch-to-workspace-right=@as []
switch-windows=['<Alt>Tab']
switch-windows-backward=['<Shift><Alt>Tab']
toggle-fullscreen=['<Alt><Super>m']
toggle-maximized=['<Super>m']
unmaximize=@as []

[org/gnome/mutter/wayland/keybindings]
restore-shortcuts=@as []

[org/gnome/settings-daemon/plugins/media-keys]
calculator=['<Alt>c']
control-center=['<Super>c']
custom-keybindings=['/org/gnome/settings-daemon/plugins/media-keys/custom-keybindings/custom0/', '/org/gnome/settings-daemon/plugins/media-keys/custom-keybindings/custom1/', '/org/gnome/settings-daemon/plugins/media-keys/custom-keybindings/custom2/', '/org/gnome/settings-daemon/plugins/media-keys/custom-keybindings/custom3/']
help=@as []
home=['<Super>e']
logout=['<Alt>e']
magnifier=@as []
magnifier-zoom-in=@as []
magnifier-zoom-out=@as []
reboot=['<Alt>r']
screenreader=@as []
search=['<Alt>space']
shutdown=['<Alt>p']
www=['<Super>n']

[org/gnome/settings-daemon/plugins/media-keys/custom-keybindings/custom0]
binding='<Super>t'
command='ptyxis --new-window'
name='Terminal'

[org/gnome/settings-daemon/plugins/media-keys/custom-keybindings/custom1]
binding='<Shift><Control><Alt>p'
command='poweroff'
name='Desligar diretamente'

[org/gnome/settings-daemon/plugins/media-keys/custom-keybindings/custom2]
binding='<Shift><Control><Alt>r'
command='reboot'
name='Reiniciar diretamente'

[org/gnome/settings-daemon/plugins/media-keys/custom-keybindings/custom3]
binding='<Alt><Super>n'
command='google-chrome'
name='Google Chrome'

[org/gnome/shell/keybindings]
focus-active-notification=@as []
show-screen-recording-ui=@as []
toggle-message-tray=@as []
